services:
  migrate:
    image: ghcr.io/${GHCR_OWNER:-local}/zenith-ops-migrate:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/migrate.Dockerfile
    container_name: zenith-migrate
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  app:
    image: ghcr.io/${GHCR_OWNER:-local}/zenith-ops-app:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: zenith-app-prod
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_FORMAT: json
    volumes:
      - ../../models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
